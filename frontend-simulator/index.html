<!doctype html>
<html lang="pl" translate="no">
  <head>
    <meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="/EVA_favicon_192.png?v=3" />
    <link rel="icon" type="image/png" href="/EVA_favicon_192.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/EVA_favicon_192.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/EVA_favicon_512.png?v=3" />
    <link rel="apple-touch-icon" href="/EVA_favicon_192.png?v=3" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>EasyVoiceAssistant</title>
    <script>
      window.__splashStartTime = Date.now();
      window.__dismissSplash = function() {
        var s = document.getElementById('splash-screen');
        if (s && !s.__dismissed) {
          s.__dismissed = true;
          s.style.opacity = '0';
          s.style.pointerEvents = 'none';
          setTimeout(function() {
            if (s && s.parentNode) s.parentNode.removeChild(s);
          }, 350);
        }
      };
      // Zabezpieczenie natywne: bez względu na stan sieci i ładowanie skryptów splash ZAWSZE znika po max 1.1s
      setTimeout(window.__dismissSplash, 1100);
    </script>
  </head>
  <body style="margin:0;padding:0;background:#ffffff;">
    <div id="splash-screen" style="position:fixed;inset:0;width:100vw;height:100dvh;background:#ffffff;display:flex;align-items:center;justify-content:center;z-index:9999999;overflow:hidden;transition:opacity 0.35s ease-out;margin:0;padding:0;pointer-events:all;user-select:none;-webkit-user-select:none;">
      <img src="/EVA_prewiu.gif" alt="EasyVoice" style="width:100%;height:100%;object-fit:cover;display:block;" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
