        <p>Stworzony dla przedsiębiorców, menedżerów, architektów, lekarzy, prawników i freelancerów. Ewa działa jak osobisty bufor przed trudnymi telefonami i niechcianym spamem:</p>

          <li>Natychmiast po rozmowie przesyła Ci czytelne podsumowanie i powiadomienie push z najważniejszymi ustaleniami.</li>
          <li>Zachowuje pełną dyskrecję – Twój prywatny kalendarz pozostaje w 100% niewidoczny dla dzwoniących.</li>
        </ul>

        <h2 style="font-size:1.4rem;font-weight:600;color:#0f172a;margin-top:24px;margin-bottom:8px;">Pakiety Firmowe B2B – Wirtualna Recepcjonistka 24/7</h2>
        <p>Dedykowany dla salonów beauty, gabinetów medycznych, gastronomii oraz firm usługowych. Zapewnia 100% odebranych połączeń i natychmiastowe rezerwacje terminów:</p>
